<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediCare | Cita Médica</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            MediCare
        </a>

        <span class="navbar-text text-white">
            Registro de Citas
        </span>

    </div>
</nav>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-7">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <h3 class="mb-2"
                        th:text="${cita.id == null ? 'Registrar Cita Médica' : 'Editar Cita Médica'}">
                        Registrar Cita Médica
                    </h3>

                    <p class="text-muted mb-4">
                        Complete la información de la cita.
                    </p>

                    <form th:action="@{/citas/guardar}"
                          th:object="${cita}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id}">

                        <div class="mb-3">

                            <label for="pacienteNombre"
                                   class="form-label">
                                Nombre del Paciente
                            </label>

                            <input type="text"
                                   id="pacienteNombre"
                                   th:field="*{pacienteNombre}"
                                   class="form-control"
                                   placeholder="Ingrese el nombre del paciente"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label for="especialidad"
                                   class="form-label">
                                Especialidad
                            </label>

                            <input type="text"
                                   id="especialidad"
                                   th:field="*{especialidad}"
                                   class="form-control"
                                   placeholder="Ejemplo: Cardiología"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label for="fecha"
                                   class="form-label">
                                Fecha de la Cita
                            </label>

                            <input type="date"
                                   id="fecha"
                                   th:field="*{fecha}"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label for="costo"
                                   class="form-label">
                                Costo
                            </label>

                            <input type="number"
                                   id="costo"
                                   th:field="*{costo}"
                                   class="form-control"
                                   min="0"
                                   step="0.01"
                                   placeholder="Ingrese el costo"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label d-block">
                                Estado
                            </label>

                            <div class="form-check form-switch">

                                <input type="checkbox"
                                       id="activa"
                                       th:field="*{activa}"
                                       class="form-check-input">

                                <label class="form-check-label"
                                       for="activa">
                                    Cita activa
                                </label>

                            </div>

                        </div>

                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary">
                                Guardar
                            </button>

                            <a th:href="@{/citas}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
