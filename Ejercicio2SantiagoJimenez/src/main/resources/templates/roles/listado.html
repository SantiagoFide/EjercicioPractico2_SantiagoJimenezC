<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediCare | Gestión de Roles</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barra superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand fw-bold" th:href="@{/}">
                MediCare
            </a>

            <span class="navbar-text text-white">
                Gestión de Roles
            </span>

        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container py-5">

        <!-- Encabezado -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="mb-1">
                    Roles del Sistema
                </h2>

                <p class="text-muted mb-0">
                    Administre los roles disponibles en MediCare.
                </p>
            </div>

            <a th:href="@{/roles/nuevo}"
               class="btn btn-primary">
                Nuevo Rol
            </a>

        </div>

        <!-- Tabla -->
        <div class="card border-0 shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-light">

                            <tr>
                                <th>ID</th>
                                <th>Nombre del Rol</th>
                                <th class="text-end">Acciones</th>
                            </tr>

                        </thead>

                        <tbody>

                            <!-- Recorrido de roles -->
                            <tr th:each="rol : ${roles}">

                                <td th:text="${rol.id}">
                                    1
                                </td>

                                <td th:text="${rol.nombre}">
                                    ADMIN
                                </td>

                                <td class="text-end">

                                    <!-- Editar -->
                                    <a th:href="@{/roles/editar/{id}(id=${rol.id})}"
                                       class="btn btn-outline-primary btn-sm">
                                        Editar
                                    </a>

                                    <!-- Eliminar -->
                                    <a th:href="@{/roles/eliminar/{id}(id=${rol.id})}"
                                       class="btn btn-outline-danger btn-sm"
                                       onclick="return confirm('¿Está seguro de eliminar este rol?');">
                                        Eliminar
                                    </a>

                                </td>

                            </tr>

                            <!-- Mensaje si no existen roles -->
                            <tr th:if="${#lists.isEmpty(roles)}">

                                <td colspan="3"
                                    class="text-center text-muted py-4">

                                    No hay roles registrados.

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- Regresar -->
        <div class="mt-4">

            <a th:href="@{/}"
               class="btn btn-outline-secondary">
                Volver al Inicio
            </a>

        </div>

    </main>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
