<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediCare | Detalle de Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            MediCare
        </a>

        <span class="navbar-text text-white">
            Información del Usuario
        </span>

    </div>

</nav>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-7">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <div class="mb-4">

                        <h3 class="mb-1">
                            Detalle del Usuario
                        </h3>

                        <p class="text-muted mb-0">
                            Información registrada en MediCare.
                        </p>

                    </div>

                    <div class="row mb-3">

                        <div class="col-sm-4 fw-bold">
                            ID
                        </div>

                        <div class="col-sm-8"
                             th:text="${usuario.id}">
                            1
                        </div>

                    </div>

                    <hr>

                    <div class="row mb-3">

                        <div class="col-sm-4 fw-bold">
                            Nombre
                        </div>

                        <div class="col-sm-8"
                             th:text="${usuario.nombre}">
                            Nombre
                        </div>

                    </div>

                    <hr>

                    <div class="row mb-3">

                        <div class="col-sm-4 fw-bold">
                            Correo
                        </div>

                        <div class="col-sm-8"
                             th:text="${usuario.email}">
                            correo@medicare.com
                        </div>

                    </div>

                    <hr>

                    <div class="row mb-3">

                        <div class="col-sm-4 fw-bold">
                            Rol
                        </div>

                        <div class="col-sm-8">

                            <span class="badge bg-secondary"
                                  th:text="${usuario.rol != null ? usuario.rol.nombre : 'Sin rol'}">
                                ADMIN
                            </span>

                        </div>

                    </div>

                    <hr>

                    <div class="row mb-3">

                        <div class="col-sm-4 fw-bold">
                            Estado
                        </div>

                        <div class="col-sm-8">

                            <span th:if="${usuario.activo}"
                                  class="badge bg-success">
                                Activo
                            </span>

                            <span th:unless="${usuario.activo}"
                                  class="badge bg-danger">
                                Inactivo
                            </span>

                        </div>

                    </div>

                    <hr>

                    <div class="row mb-4">

                        <div class="col-sm-4 fw-bold">
                            Fecha de Creación
                        </div>

                        <div class="col-sm-8"
                             th:text="${usuario.fechaCreacion != null ? #temporals.format(usuario.fechaCreacion, 'dd/MM/yyyy HH:mm') : 'No disponible'}">
                            12/08/2026
                        </div>

                    </div>

                    <div class="d-flex gap-2">

                        <a th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                           class="btn btn-primary">
                            Editar
                        </a>

                        <a th:href="@{/usuarios}"
                           class="btn btn-outline-secondary">
                            Regresar
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
