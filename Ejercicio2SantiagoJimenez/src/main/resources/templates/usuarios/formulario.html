<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediCare | Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
           th:href="@{/}">
            MediCare
        </a>

        <span class="navbar-text text-white">
            Registro de Usuario
        </span>

    </div>

</nav>

<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-7">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4">

                    <h3 class="mb-2"
                        th:text="${usuario.id == null ? 'Registrar Usuario' : 'Editar Usuario'}">
                        Registrar Usuario
                    </h3>

                    <p class="text-muted mb-4">
                        Complete los datos de la cuenta.
                    </p>

                    <form th:action="@{/usuarios/guardar}"
                          th:object="${usuario}"
                          method="post">

                        <input type="hidden"
                               th:field="*{id}">

                        <div class="mb-3">

                            <label for="nombre"
                                   class="form-label">
                                Nombre Completo
                            </label>

                            <input type="text"
                                   id="nombre"
                                   th:field="*{nombre}"
                                   class="form-control"
                                   placeholder="Ingrese el nombre"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label for="email"
                                   class="form-label">
                                Correo Electrónico
                            </label>

                            <input type="email"
                                   id="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   placeholder="usuario@correo.com"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label for="password"
                                   class="form-label">
                                Contraseña
                            </label>

                            <input type="password"
                                   id="password"
                                   th:field="*{password}"
                                   class="form-control"
                                   placeholder="Ingrese una contraseña"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label for="rol"
                                   class="form-label">
                                Rol
                            </label>

                            <select id="rol"
                                    th:field="*{rol.id}"
                                    class="form-select"
                                    required>

                                <option value="">
                                    Seleccione un rol
                                </option>

                                <option th:each="rol : ${roles}"
                                        th:value="${rol.id}"
                                        th:text="${rol.nombre}">
                                    ADMIN
                                </option>

                            </select>

                        </div>

                        <div class="mb-4">

                            <label class="form-label d-block">
                                Estado
                            </label>

                            <div class="form-check form-switch">

                                <input class="form-check-input"
                                       type="checkbox"
                                       id="activo"
                                       th:field="*{activo}">

                                <label class="form-check-label"
                                       for="activo">
                                    Usuario activo
                                </label>

                            </div>

                        </div>

                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-primary">
                                Guardar
                            </button>

                            <a th:href="@{/usuarios}"
                               class="btn btn-outline-secondary">
                                Cancelar
                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
